name: Reportar un error
description: Algo no funciona como debería
labels: ["error"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      placeholder: |
        1. Cargo un tema en el deck A
        2. Aprieto SYNC
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de BROSS DJ
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Windows y equipo
      placeholder: "Windows 11, controlador MIDI, placa de sonido..."
  - type: textarea
    id: extra
    attributes:
      label: Capturas o archivos (opcional)
